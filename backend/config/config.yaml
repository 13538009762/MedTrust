server:
  port: 8080
  jwt_secret: "medtrust_secure_jwt_secret_key_2026"
  jwt_expire_hours: 24

database:
  dsn: "root:123456@tcp(127.0.0.1:3306)/medtrust?charset=utf8mb4&parseTime=True&loc=Local"

# 分布式链下密文存储服务 (支持真实 IPFS 守护进程与 LocalStorageAdapter 容灾模式)
ipfs:
  mode: "live" # "live" 或 "mock"
  api_url: "http://127.0.0.1:5001" # IPFS RPC API 端点
  storage_dir: "./data/ipfs_storage" # 本地密文持久化存储与加速缓存目录

# 区块链存证与账本服务 (双模设计: 具备完整 Fabric 2.5 链码与 gRPC 网关，亦具备单机离线容灾引擎)
blockchain:
  mode: "fabric" # "fabric" 或 "mock"，支持环境变量 BLOCKCHAIN_MODE 覆盖 (最高优先级)
  channel_id: "medchannel"
  chaincode_id: "medical"
  ledger_dir: "./data/fabric_ledger"
  fabric:
    enabled: true
    peer_endpoint: "127.0.0.1:7051"
    gateway_peer: "peer0.org1.example.com"
    msp_id: "Org1MSP"
    tls_cert_path: "./fabric_crypto/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt"
    cert_path: "./fabric_crypto/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/Admin@org1.example.com-cert.pem"
    key_path: "./fabric_crypto/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore"

security:
  aes_master_key: "MedTrustMasterKeyAES256GCM2026!" # 32-byte 主密钥

risk:
  low_threshold: 30
  high_threshold: 60

# Redis 高性能缓存与 Token 黑名单服务 (无 Redis 时自动平滑降级至 MemoryCache 内存缓存)
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

# AI 跨期病历关联辅助诊断与临床大模型接入配置
# 支持接入任意 OpenAI 兼容大模型 API (如 DeepSeek, GPT-4o, Qwen, GLM 等)
# 当 api_key 留空时，系统自动无缝启用内置高精度医疗知识时空演变推理引擎
ai:
  enabled: true
  api_url: "" # 填入您的 AI API 端点 (例如: https://api.deepseek.com/v1 或 https://api.openai.com/v1)
  api_key: "" # 填入您的 API Key (例如: sk-xxxxxxxxxxxx)
  model: "deepseek-chat" # 模型名称 (如: deepseek-chat, gpt-4o, qwen-turbo)
  temperature: 0.2


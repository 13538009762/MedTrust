services:
  mysql:
    image: mysql:8.0
    container_name: medtrust-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - medtrust-mysql-data:/var/lib/mysql
    networks:
      - medtrust-fabric-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.0
    container_name: medtrust-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - medtrust-redis-data:/data
    networks:
      - medtrust-fabric-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai_agent:
    build:
      context: ./ai_agent
      dockerfile: Dockerfile
    image: medtrust-ai-agent:2.0
    container_name: medtrust-ai-agent
    restart: unless-stopped
    environment:
      GO_BACKEND_URL: http://backend:8080/api/v1
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - medtrust-fabric-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: medtrust-backend:2.0
    container_name: medtrust-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DB_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: ${JWT_SECRET}
      AES_MASTER_KEY: ${AES_MASTER_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      BLOCKCHAIN_MODE: ${BLOCKCHAIN_MODE}
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_URL: ${AI_API_URL}
      AI_MODEL: ${AI_MODEL}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medtrust-fabric-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: medtrust-frontend:2.0
    container_name: medtrust-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
      ai_agent:
        condition: service_healthy
    networks:
      - medtrust-fabric-net

networks:
  medtrust-fabric-net:
    name: medtrust-fabric-net
    driver: bridge

volumes:
  medtrust-mysql-data:
    name: medtrust-mysql-data
  medtrust-redis-data:
    name: medtrust-redis-data
